[tool.black]
line-length = 110
target-version = ["py312"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
# Длину строк контролирует black
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/migrations/env.py" = ["E402"]
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
