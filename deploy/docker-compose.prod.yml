# ─── Сервер ────────────────────────────────────────────────────────────────────
# Образы берутся из Docker Hub, настройки лежат в deploy/.env на сервере

services:
  db:
    image: postgres:16-alpine
    restart: always
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 5
      timeout: 5s
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    image: ${DOCKERHUB_USERNAME}/stroybaza97-backend:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'
      "
    volumes:
      - media:/app/media

  frontend:
    image: ${DOCKERHUB_USERNAME}/stroybaza97-frontend:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      - backend
    env_file:
      - .env

  nginx:
    image: nginx:1.29-alpine
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # NGINX_SITE: http до выпуска сертификата, https после ssl.sh
      - ./nginx/${NGINX_SITE:-http}.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx:/etc/nginx/stroybaza:ro
      # Фото товаров отдаёт nginx напрямую
      - media:/var/www/media:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro

  # Выпуск и продление сертификата Let's Encrypt, запускает ssl.sh и cron
  certbot:
    image: certbot/certbot:v5.8.0
    profiles: ["certbot"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot

volumes:
  db-data:
  media:
  letsencrypt:
  certbot-www:
