# Сайт по http: первый запуск и пока нет сертификата. После ssl.sh работает https.conf

include /etc/nginx/stroybaza/zones.conf;

server {
    listen 80;
    server_name _;

    # Проверка домена для Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/stroybaza/locations.conf;
}
