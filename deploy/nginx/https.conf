# Сайт по https на stroybaza97.ru. Включает ssl.sh после выпуска сертификата

include /etc/nginx/stroybaza/zones.conf;

# http, IP и www ведут на https://stroybaza97.ru
server {
    listen 80 default_server;
    server_name _;

    # Продление сертификата идёт по http
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://stroybaza97.ru$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/stroybaza97.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stroybaza97.ru/privkey.pem;

    return 301 https://stroybaza97.ru$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name stroybaza97.ru;

    ssl_certificate /etc/letsencrypt/live/stroybaza97.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stroybaza97.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/stroybaza/locations.conf;
}
