# Ограничения частоты запросов. Подключаются в http.conf и https.conf вне блока server

# Не больше 5 попыток входа в минуту с одного адреса
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
# Защита от заваливания менеджера фальшивыми заказами
limit_req_zone $binary_remote_addr zone=orders:10m rate=3r/m;
